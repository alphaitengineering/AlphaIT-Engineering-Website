<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Aether Mineral atmospheric background</title>
  <desc id="desc">A restrained light-first field moving from Aether Sky through Future Pearl and Platinum Mist.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D6E6F0"/>
      <stop offset="0.48" stop-color="#EFF6FA"/>
      <stop offset="1" stop-color="#F7F3EC"/>
    </linearGradient>
    <linearGradient id="mineral" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F3EC" stop-opacity="0"/>
      <stop offset="1" stop-color="#CDD4D8" stop-opacity="0.64"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect y="580" width="1920" height="500" fill="url(#mineral)"/>
  <path d="M0 780H1920" stroke="#FFFFFF" stroke-opacity="0.72"/>
  <path d="M1180 0V1080" stroke="#CDD4D8" stroke-opacity="0.42"/>
</svg>
